[package]
name = "taildrop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Taildrop: send files over your tailnet"

[[bin]]
name = "taildrop-cli"
path = "src/main.rs"

[dependencies]
taildrop-core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
