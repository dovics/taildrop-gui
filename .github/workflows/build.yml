name: build

# Builds on the real target platforms instead of cross-compiling: Qt Quick's
# Windows deployment (windeployqt, QML import scanning) only behaves correctly
# on Windows itself.
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Build engine
        run: cargo build --release --bin taildrop-cli

      - name: Run Rust tests
        run: cargo test --release

      # qmake needs cl.exe and nmake on PATH; the runner has them but does not
      # put them there until the developer environment is loaded.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # MSVC rather than the Qt mingw build: windows-latest ships a complete
      # MSVC toolchain, while Qt's mingw package has no compiler of its own.
      - name: Build GUI
        shell: cmd
        run: |
          mkdir gui\build-win
          cd gui\build-win
          qmake ..\taildrop-gui.pro "CONFIG+=release"
          nmake /NOLOGO

      # windeployqt copies the Qt DLLs *and* scans the QML sources for the
      # imports they use. Without the QML pass the app starts and immediately
      # shows a blank window, so --qmldir is not optional.
      - name: Deploy Qt runtime
        shell: cmd
        run: |
          windeployqt --release --qmldir gui\src gui\build-win\taildrop-gui.exe
          copy target\release\taildrop-cli.exe gui\build-win\taildrop-cli.exe
          copy LICENSE gui\build-win\LICENSE.txt

      - name: Assemble package
        shell: cmd
        run: |
          mkdir taildrop-windows-x64
          xcopy /E /I /Y gui\build-win taildrop-windows-x64
          copy gui\pkgbuild\install-windows.ps1 taildrop-windows-x64\install-windows.ps1
          powershell -Command "Compress-Archive -Path taildrop-windows-x64 -DestinationPath taildrop-windows-x64.zip -Force"

      # Start the app on a real Windows machine. What cannot be checked from
      # anywhere else is Windows behaviour itself: a tray that silently never
      # appears, a --background start that paints a window first, or a second
      # launch that becomes a second receiver. Each of those builds fine and
      # fails only for the person using it.
      - name: Smoke test the window and the tray
        shell: pwsh
        run: |
          $exe = "gui\build-win\taildrop-gui.exe"

          # 1. Background start: listening, with no window. This is how the
          #    Startup shortcut runs it, and a window flashing up at every login
          #    is exactly what it must not do.
          $bg = Start-Process -FilePath $exe -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 6
          if ($bg.HasExited) { throw "background start exited with code $($bg.ExitCode)" }
          $visible = @(Get-Process taildrop-gui | Where-Object { $_.MainWindowHandle -ne 0 })
          if ($visible.Count -ne 0) { throw "--background opened a window" }

          # 2. The engine is really listening; without it there is nothing to
          #    receive with and the tray icon would lie.
          if (-not (Get-Process taildrop-cli -ErrorAction SilentlyContinue)) {
            throw "taildrop-cli did not start; the app is not listening"
          }

          # 3. A second launch is a request to show the window, not a second
          #    receiver that would fail to bind 53318.
          $second = Start-Process -FilePath $exe -PassThru -Wait
          if ($second.ExitCode -ne 0) { throw "second launch exited with $($second.ExitCode)" }
          Start-Sleep -Seconds 2

          $instances = @(Get-Process taildrop-gui -ErrorAction SilentlyContinue)
          if ($instances.Count -ne 1) { throw "expected 1 taildrop-gui, found $($instances.Count)" }
          $visible = @(Get-Process taildrop-gui | Where-Object { $_.MainWindowHandle -ne 0 })
          if ($visible.Count -ne 1) { throw "the running instance did not show its window" }
          $engines = @(Get-Process taildrop-cli -ErrorAction SilentlyContinue)
          if ($engines.Count -ne 1) { throw "expected 1 receiver, found $($engines.Count)" }

          Stop-Process -Id $bg.Id -Force
          Write-Host "background start hides, second launch shows, one receiver throughout"

      - uses: actions/upload-artifact@v4
        with:
          name: taildrop-windows-x64
          path: taildrop-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libgl1-mesa-dev libxkbcommon-dev libvulkan-dev

      # Ubuntu 24.04 ships Qt 6.4, but the QML uses `required property`, which
      # arrived in 6.5. Use the same Qt version as the Windows job so that a
      # QML feature cannot work on one platform and fail on the other.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: linux_gcc_64
          cache: true

      - name: Build engine
        run: cargo build --release --bin taildrop-cli

      - name: Run Rust tests
        run: cargo test --release

      - name: Build GUI
        run: |
          mkdir -p gui/build-linux
          cd gui/build-linux
          qmake6 ../taildrop-gui.pro
          make -j"$(nproc)"

      - name: Assemble package
        run: |
          mkdir -p taildrop-linux-x64
          cp gui/build-linux/taildrop-gui taildrop-linux-x64/
          cp target/release/taildrop-cli taildrop-linux-x64/
          cp LICENSE taildrop-linux-x64/
          tar -czf taildrop-linux-x64.tar.gz taildrop-linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: taildrop-linux-x64
          path: taildrop-linux-x64.tar.gz
          if-no-files-found: error
